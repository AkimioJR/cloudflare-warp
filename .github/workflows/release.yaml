name: Publish Cloudflare Warp Release

on:
  workflow_call:
    inputs:
      app_version:
        description: "Cloudflare WARP version to publish."
        required: true
        type: string
      publish_docker:
        description: "Whether to build and push the Docker image after publishing."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      app_version:
        description: "Cloudflare WARP version to publish."
        required: true
        type: string
      publish_docker:
        description: "Build and push the Docker image after publishing."
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          latest_version=$(uv run python -c 'import asyncio, sys; sys.path.insert(0, "scripts"); from get_latest_version import get_latest_version; print(asyncio.run(get_latest_version())[0])')
          if [[ "$latest_version" != "${{ inputs.app_version }}" ]]; then
            echo "Input app_version (${{ inputs.app_version }}) does not match latest Cloudflare WARP version ($latest_version)"
            exit 1
          fi

      - name: Download release artifacts
        run: |
          uv run scripts/release.py

      - name: List release assets
        run: |
          ls -la dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.app_version }}
          name: v${{ inputs.app_version }}
          generate_release_notes: true
          files: |
            dist/release/*

  build-and-push-docker:
    needs: publish-release
    if: ${{ inputs.publish_docker }}
    uses: ./.github/workflows/docker.yaml
    with:
      app_version: ${{ inputs.app_version }}
      publish_version_tag: true
    permissions:
      actions: write
      contents: read
    secrets: inherit
