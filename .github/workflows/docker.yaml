name: Build Docker Image

on:
  workflow_call:
    inputs:
      app_version:
        description: "Cloudflare WARP version tag to publish."
        required: false
        type: string
      publish_version_tag:
        description: "Whether to publish the version tag in addition to latest."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      app_version:
        description: "Cloudflare WARP version tag to publish."
        required: false
        type: string
      publish_version_tag:
        description: "Whether to publish the version tag in addition to latest."
        required: false
        default: false
        type: boolean

permissions:
  actions: write # 主要是为了 Docker build cache 使用 type=gha 时更稳，因为 cache backend 可能需要操作 Actions cache
  contents: read # 读取仓库内容以获取 Dockerfile 和相关文件

env:
  IMAGE_NAME: cloudflare-warp
  IS_LATEST: true
  APP_VERSION: ${{ inputs.app_version || 'manual' }}
  PUBLISH_VERSION_TAG: ${{ inputs.publish_version_tag || false }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version tag
        if: ${{ env.PUBLISH_VERSION_TAG == 'true' && env.APP_VERSION == '' }}
        run: |
          echo "app_version is required when publish_version_tag is true"
          exit 1

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ env.IS_LATEST }}
            type=raw,value=${{ env.APP_VERSION }},enable=${{ env.PUBLISH_VERSION_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}-docker
          cache-to: type=gha,scope=${{ github.workflow }}-docker,mode=max
