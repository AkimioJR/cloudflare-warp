name: Check Cloudflare Warp Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      needs_sync: ${{ steps.check_version.outputs.needs_sync }}
      official_version: ${{ steps.check_version.outputs.official_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check version
        id: check_version
        shell: bash
        run: |
          set -euo pipefail
          json_payload=$(uv run scripts/check_version.py)
          needs_sync=$(printf '%s\n' "$json_payload" | jq -r '.needs_sync')
          official_version=$(printf '%s\n' "$json_payload" | jq -r '.official_version')

          if [[ "$needs_sync" != "true" && "$needs_sync" != "false" ]]; then
            echo "Invalid needs_sync value: $needs_sync"
            exit 1
          fi

          echo "needs_sync=$needs_sync" >> "$GITHUB_OUTPUT"
          echo "official_version=$official_version" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: check-update
    if: ${{ needs.check-update.outputs.needs_sync == 'true' }}
    uses: ./.github/workflows/release.yaml
    with:
      app_version: ${{ needs.check-update.outputs.official_version }}
      publish_docker: true
    permissions:
      actions: write
      contents: write
    secrets: inherit
