[project]
name = "cloudflare-warp"
version = "0.1.0"
description = "Scan the Cloudflare Warp repository regularly, automatically download the version, and publish a Release"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "types-aiofiles>=25.1.0.20260518",
]
